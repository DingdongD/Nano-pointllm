[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanopointllm"
version = "0.0.1"
description = "Llama-style decode engine scaffold for PointLLM (fork from nano-vllm ideas; not nanovllm)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.0",
  "transformers>=4.28.0",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanopointllm*"]
